[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "skill-northbound-margin-monitor"
version = "1.0.0"
description = "Daily A-share north-bound capital + margin trading panorama monitor"
requires-python = ">=3.10"
license = {text = "GPLv3"}
readme = "README.md"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.22,<2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "akshare>=1.18.0",
    "requests>=2.28",
]

[project.optional-dependencies]
pandadata = ["panda_data>=0.0.9"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
mcp = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://www.quantskills.ai"
Repository = "https://github.com/fuwentao03/skill-northbound-margin-monitor"

[project.scripts]
monitor = "run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
