data:
  panel_path: toy_data/unused_panel.parquet
  bar_dir: toy_data/unused_bars
  label_path: toy_data/labels.parquet
  factor_dir: toy_data/factors
  factor_manifest: toy_data/manifest.csv
  prepared_feature_cache: toy_data/prepared_features.parquet

split:
  train_start: "2020-01-01"
  train_end: "2020-03-13"
  valid_start: "2020-03-16"
  valid_end: "2020-04-24"
  oos_start: "2020-04-27"
  oos_end: "2020-06-16"
  embargo_bars: 2

universe:
  symbols: null
  train_label_min_coverage: 0.95

preprocess:
  factor_transform: cross_sectional
  label_transform: raw
  winsor_lower: 0.01
  winsor_upper: 0.99
  cross_sectional_zscore: true
  demean_label: true
  min_cross_section: 8

model:
  type: ridge
  ridge_alpha: 10.0
  equal_date_weight: true

selection:
  random_seed: 20260721
  initial_factor: factor_base
  max_factors: 6
  top_n_log: 5
  patience: 2
  min_factors_before_stopping: 2
  min_delta: 0.00001
  min_residual_score: 0.0
  score_method: pearson

beam:
  progress: true
  deterministic_roots: true
  root_width: 4
  width: 3
  branch_width: 2
  final_depth: 4
  early_stopping_patience: 0
  early_stopping_min_delta: 0.00001
  diversity_max_jaccard: 0.85
  stability_penalty: 0.25
  min_year_weight: 0.10
  complexity_penalty: 0.0
  one_standard_error: false
  trend_window: 2
  trend_weight: 0.0
  continuation_weight: 0.0
  continuation_probe_width: 0
  cv_jobs: 1
  ridge_alphas: [1.0, 10.0]
  cv_folds:
    - fit_start: "2020-01-01"
      fit_end: "2020-01-31"
      score_start: "2020-02-03"
      score_end: "2020-02-21"
    - fit_start: "2020-01-01"
      fit_end: "2020-02-21"
      score_start: "2020-02-24"
      score_end: "2020-03-11"
    - fit_start: "2020-01-01"
      fit_end: "2020-03-11"
      score_start: "2020-03-16"
      score_end: "2020-04-22"

pool:
  progress: true
  max_steps: 4
  pool_capacity: null
  pruning_alpha: 10.0
  min_delta: 0.0
  patience: 0
  top_n_log: 5

output:
  root: ../../.skill_outputs/residual_factor_selection_smoke
  experiment_name: residual_factor_selection_toy
