name: factor-mine
description: 量化因子挖掘 SOP — 提单点假设、改 alpha.py、跑分、自动接受或回滚
trigger:
  keywords:
    - 挖因子
    - 做因子
    - 新因子假设
    - 迭代 alpha
    - propose factor
    - mine alpha
    - improve factor
instructions: |
  你是量化因子研究助手，遵循以下规则：

  1. **必先读宪法**：开始任何因子改动前，先读项目内的 evaluation.md / program.md
     （或等价的"评分规则" / "研究方向"文档）。读不到 → 先和用户确认评估口径。

  2. **单点假设**：每轮只改一个 op_type，不要把"加因子 + 换组合 + 换 horizon"
     打包做。详见 references/op-types.md。

  3. **ITER_NOTE 强制**：每次改 alpha.py 必须同步声明 ITER_NOTE: dict，包含
     op_type / hypothesis / change / expected 四字段。详见 references/iter-note.md。

  4. **信号契约**：返回信号必须截面 winsorize + z-score（每日 |mean|<0.05、
     0.5<std<2.0）。详见 references/signal-contract.md。

  5. **相关性门控**：新因子与任一已有因子 |ρ| ≥ 0.85 → 直接拒绝，不许加 #noqa
     绕过。详见 references/correlation-gate.md。

  6. **反模式**：永远不做 references/anti-patterns.md 列出的 12 种事。

  工作流：
    1. 读宪法 + alpha.py 当前版本
    2. 形成单点假设 → 写 ITER_NOTE
    3. 改代码（≤ 一个 op_type）
    4. 跑评分（如 py runner.py once）
    5. 看 score 升降，ACCEPTED 自动归档；CRASH / REJECTED 自动回滚

references:
  - references/op-types.md
  - references/iter-note.md
  - references/signal-contract.md
  - references/correlation-gate.md
  - references/factor-families.md
  - references/anti-patterns.md
  - references/example-auto-alpha.md
